[package]
name = "optimizer-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2.73"
serde = { version = "1.0.130", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
rand = { version = "0.9.0", default-features = false, features = ["small_rng"] }

[dev-dependencies]
optimizer-wasm = { path = "." }

[lib]
crate-type = ["cdylib", "rlib"]
