<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasm Optimizer</title>
</head>

<body>
    <h1>Wasm Optimizer</h1>
    <button id="run-button">Run Optimization</button>
    <pre id="result"></pre>
    <script type="module">
        import init, { solve_optimization_problem } from './pkg/optimizer_wasm.js';

        async function run() {
            await init();
            const prices = [
                [13000.0, 5000.0, 2000.0, 4000.0, 6000.0, 7500.0, 8000.0, 3000.0, 9000.0, 8000.0, 2000.0, 2000.0, 4000.0, 4000.0, 5000.0, 400.0],
                [12000.0, 6000.0, 3000.0, 5000.0, 7000.0, 6000.0, 9000.0, 1000.0, 2000.0, 8500.0, 1000.0, 4000.0, 3000.0, 4000.0, 5500.0, 500.0],
                [14000.0, 5500.0, 2500.0, 3000.0, 8000.0, 7000.0, 6000.0, 2000.0, 6000.0, 9000.0, 2000.0, 2500.0, 4500.0, 4000.0, 4000.0, 600.0]
            ];
            const stocks = [
                [1, 2, 1, 1, 2, 3, 4, 5, 6, 3, 2, 2, 4, 4, 5, 8],
                [0, 2, 1, 2, 2, 3, 4, 5, 6, 3, 2, 2, 4, 4, 5, 8],
                [2, 2, 1, 3, 2, 3, 4, 5, 6, 3, 2, 2, 4, 4, 5, 8]
            ];
            const needs = [1, 2, 3, 4, 5, 6, 5, 4, 8, 7, 3, 5, 7, 9, 3, 18];
            const stores = [
                { 'name': 'Shop A', 'free_shipping': { 'num': 5, 'sum': 110 }, 'base_shipping': 5 },
                { 'name': 'Shop B', 'free_shipping': { 'num': 7, 'sum': 100 }, 'base_shipping': 3 },
                { 'name': 'Shop C', 'free_shipping': { 'num': 2, 'sum': 120 }, 'base_shipping': 7 }
            ];

            const result = solve_optimization_problem(
                prices,
                stocks,
                needs,
                stores
            );
            document.getElementById('result').textContent = result;
        }

        document.getElementById('run-button').addEventListener('click', run);
    </script>
</body>

</html>
